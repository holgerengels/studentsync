<VirtualHost *:443>
        SSLEngine On
        SSLCertificateFile       /etc/apache2/ssl/wildcard.valckenburgschule.de.crt
        SSLCertificateKeyFile    /etc/apache2/ssl/wildcard.valckenburgschule.de.key
        SSLCACertificateFile     /etc/apache2/ssl/ca_bundle
        SSLProtocol ALL -SSLv2 -SSLv3

        ServerAlias 10.16.205.136
        ServerName usersync.valckenburgschule.de

        ServerAdmin h.engels@valckenburgschule.de
        DocumentRoot "/var/www/sync"
        Alias "/sync" "/var/www/sync"

        <Directory "/var/www/sync">
                RewriteEngine On
                RewriteBase /sync/
                RewriteRule ^index\.html$ - [L]
                RewriteCond %{REQUEST_FILENAME} !-f
                RewriteCond %{REQUEST_FILENAME} !-d
                RewriteRule . /index.html [L]

                Order allow,deny
                allow from all
        </Directory>

        ErrorLog ${APACHE_LOG_DIR}/error.log
        # Possible values include: debug, info, notice, warn, error, crit,
        # alert, emerg.
        LogLevel warn
        CustomLog ${APACHE_LOG_DIR}/access.log combined

        ProxyPass /server "ajp://127.0.0.1:8009/server"
        ProxyPassReverse /server  "ajp://127.0.0.1:8009/server"
</VirtualHost>
