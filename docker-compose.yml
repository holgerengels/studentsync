version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: synx_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  mysql:
    image: mysql:8
    container_name: synx_mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: synx
      MYSQL_DATABASE: untis
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: synx_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: synx
      POSTGRES_DB: asv
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  mongo_data:
  mysql_data:
  postgres_data:
